# ##############################################################################
# kitty configuration
# ##############################################################################

foreground #ffffff
background #151330
color0 #28353e
color8 #475e6c
color1 #FF3F4F
color9 #ff6f7b
color2  #00f968
color10 #40fb8e
color3  #FFD945
color11 #ffe374
color4  #00a0e4
color12 #40b8eb
color5  #E373CE
color13 #ea96da
color6  #19D1E5
color14 #53ddec
color7  #aec3d0
color15 #becfda
selection_background #1679b6
selection_foreground #ffffff
cursor #ffffff
cursor_text_color #151330
url_color #00a0e4
macos_titlebar_color #151330

font_family jetbrainsmono nerd font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 9
disable_ligatures never
shell bash
editor vim
term xterm-256color
scrollback_lines 4096
copy_on_select no
url_style single
open_url_with default
cursor_shape block
cursor_blink_interval 0.25
cursor_stop_blinking_after 0
hide_window_decorations no
window_padding_width 8
background_opacity 1
macos_option_as_alt no
macos_quit_when_last_window_closed yes
linux_display_server x11

map ctrl+shift+c copy_to_clipboard
map cmd+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map cmd+shift+v paste_from_clipboard
